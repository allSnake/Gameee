<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absurd Industries</title>
<style>
  :root {
    --bg: #1b2430;
    --panel: rgba(20, 28, 40, 0.9);
    --panel-solid: #172030;
    --line: rgba(255,255,255,.09);
    --text: #eef2f7;
    --muted: #9fb0c3;
    --accent: #ffb703;
    --accent-2: #8ecae6;
    --good: #7bdc8e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; }
  button { font: inherit; color: inherit; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(6px); }
  .dot { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; vertical-align: -1px; }
  kbd { font-size: 11px; color: var(--muted); border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 0 5px; font-family: inherit; }
  .btn { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 7px 10px; border-radius: 8px;
    font-size: 13px; background: rgba(142,202,230,.15); color: var(--accent-2); }
  .btn:hover { background: rgba(142,202,230,.28); }
  .btn.active { background: rgba(255,183,3,.2); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #1b2430; font-weight: 700; padding: 10px 18px; font-size: 15px; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* Navigation links */
  #nav { left: 12px; top: 12px; width: 64px; display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; align-items: stretch; }
  #nav .logo-s { font-size: 11px; font-weight: 800; color: var(--accent); text-align: center; letter-spacing: .04em; line-height: 1.1; margin-bottom: 6px; }
  .navbtn { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0; border-radius: 9px; color: var(--muted); }
  .navbtn:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .navbtn .ic { font-size: 18px; line-height: 1; }
  .navbtn .lb { font-size: 10px; }

  /* Bauleiste unten */
  #buildbar { left: 388px; right: 12px; bottom: 12px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .bb-head { display: flex; gap: 6px; align-items: center; }
  .cat { all: unset; cursor: pointer; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; color: var(--muted); }
  .cat:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .cat.active { background: rgba(255,183,3,.16); color: var(--accent); }
  .cat .n { font-size: 10.5px; opacity: .7; margin-left: 3px; }
  #search { margin-left: auto; width: 170px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 999px; color: var(--text);
    padding: 5px 12px; font: inherit; font-size: 12.5px; outline: none; }
  #search:focus { border-color: rgba(255,183,3,.6); }
  #tiles { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .tool { all: unset; box-sizing: border-box; flex: none; width: 82px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 5px 4px 6px; border-radius: 10px; border: 1px solid transparent; position: relative; background: rgba(255,255,255,.03); }
  .tool:hover { background: rgba(255,255,255,.08); }
  .tool.active { border-color: var(--accent); background: rgba(255,183,3,.12); }
  .tool img { width: 52px; height: 52px; }
  .tool .ph { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; font-size: 24px; }
  .tool .nm { font-size: 11px; line-height: 1.2; text-align: center; height: 26px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tool .cost { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tool .new { position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 800; color: #1b2430; background: var(--good); border-radius: 4px; padding: 0 4px; }
  .tool kbd { position: absolute; top: 4px; right: 4px; font-size: 9.5px; padding: 0 4px; }
  .tool.poor { opacity: .4; }
  .tool.sep { margin-left: 10px; }
  .tool.sep::before { content: ''; position: absolute; left: -9px; top: 10px; bottom: 10px; border-left: 1px solid var(--line); }
  #topbar .stock, #topbar .power { font-size: 13px; color: var(--muted); }
  #topbar .power b { color: #ffd166; }
  #topbar .power.bad { color: #ff8a7a; }
  .upgrades { display: grid; gap: 10px; margin-top: 16px; }
  .upgrade { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
  table.stats { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13.5px; }
  table.stats th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  table.stats td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,.04); font-variant-numeric: tabular-nums; }
  #topbar .stock b { color: #cfd8e3; font-variant-numeric: tabular-nums; }
  .tool.erase { margin-top: 6px; }
  .row { display: flex; gap: 6px; }
  .row .btn { flex: 1; white-space: nowrap; font-size: 12.5px; padding: 7px 6px; }

  /* Kopfzeile */
  #topbar { left: 50%; transform: translateX(-50%); top: 12px; display: flex; gap: 10px; align-items: center; padding: 6px 8px 6px 14px; }
  #topbar .title { font-weight: 700; font-size: 14px; }
  #topbar .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 44px; }
  #topbar .btn { padding: 5px 9px; }

  /* Ziel */
  #right { position: fixed; right: 12px; top: 12px; width: 250px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 24px); }
  #right .panel { position: static; }
  #goal { overflow-y: auto; min-height: 0; flex: 0 1 auto; }
  #showcase { height: 210px; flex: none; background: transparent; backdrop-filter: none; cursor: zoom-in; padding: 8px 10px; transition: height .2s; }
  #showcase span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #right.big { width: min(520px, 46vw); }
  #right.big #showcase { height: min(520px, 60vh); cursor: zoom-out; }
  #goal h2 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
  #parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  #parts li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
  #parts li:hover { background: rgba(255,255,255,.06); }
  #parts li .pn { flex: 1; }
  #parts li .pc { color: var(--muted); font-variant-numeric: tabular-nums; }
  #parts li.ok .pc, #parts li.ok .pn { color: var(--good); }
  #bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: 10px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .stars { color: var(--accent); letter-spacing: 1px; }
  .stars .off { color: rgba(255,255,255,.18); }

  #info { left: 88px; bottom: 12px; font-size: 13px; line-height: 1.5; width: 290px; max-height: 40vh; overflow-y: auto; }
  #info:empty { display: none; }
  #info b { color: var(--accent); }
  #info .st { color: var(--muted); }
  #info .st.bad { color: #ff8a7a; }
  #info .st.good { color: var(--good); }
  #tutorial { left: 50%; transform: translateX(-50%); top: 66px; max-width: min(560px, 46vw); font-size: 14px; line-height: 1.5; border-color: rgba(255,183,3,.35); }
  #tutorial:empty { display: none; }
  #tutorial .step { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  #tutorial b { color: var(--accent); }
  #toast { left: 50%; top: 22%; transform: translateX(-50%); font-size: 18px; font-weight: 700;
    color: var(--accent); text-align: center; opacity: 0; pointer-events: none; transition: opacity .35s; }
  #toast.show { opacity: 1; }

  /* Overlays */
  #overlay { position: fixed; inset: 0; background: rgba(10, 14, 22, .72); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  #overlay.show { display: flex; }
  .card { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; max-width: 860px; width: 100%;
    max-height: calc(100vh - 40px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .card h2 { margin: 0 0 6px; font-size: 26px; }
  .card h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .card p { margin: 0; line-height: 1.55; color: #d6dee8; }
  .card .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 13px; }
  .logo { font-size: 34px; font-weight: 800; letter-spacing: .04em; color: var(--accent); margin: 0; }
  .sub { color: var(--muted); margin-top: 2px; }
  h3.era { margin: 22px 0 2px; color: var(--accent); font-size: 14px; }
  .era-banner { margin: 6px 0 12px !important; padding: 10px 12px; border-radius: 10px; background: rgba(63,169,255,.12); border: 1px solid rgba(63,169,255,.35); }
  .era-banner b { color: #8ecae6; }
  .chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
  .chapter { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: rgba(255,255,255,.03); display: flex; flex-direction: column; gap: 6px; min-height: 140px; }
  .chapter:hover { border-color: rgba(255,183,3,.5); background: rgba(255,183,3,.06); }
  .chapter.locked { cursor: not-allowed; opacity: .45; }
  .chapter.locked:hover { border-color: var(--line); background: rgba(255,255,255,.03); }
  .chapter .num { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .chapter .name { font-size: 17px; font-weight: 700; }
  .chapter .desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; flex: 1; }
  .chapter .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .bigstars { font-size: 44px; text-align: center; margin: 10px 0 4px; }
  .center { text-align: center; }
  .linkish { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; text-decoration: underline; }
  .tree, .tree ul { list-style: none; margin: 0; padding-left: 18px; }
  .tree { padding-left: 0; }
  .tree li { margin: 3px 0; font-size: 13.5px; }
  .tree ul { border-left: 1px dashed rgba(255,255,255,.15); margin-left: 5px; }
  .tree .via { color: var(--muted); }
  .tree .via b { color: var(--accent-2); font-weight: 600; }
  .bookpart { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  .bookpart.flash { border-color: var(--accent); }
  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .recipes div { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.04); line-height: 1.5; }
  .recipes b { color: var(--accent-2); }

  /* Hauptmenü */
  .card.menu { max-width: 1180px; padding: 0; overflow: hidden; display: grid; grid-template-columns: 1fr 340px; max-height: calc(100vh - 40px); }
  .menu-main { padding: 28px 30px; overflow-y: auto; }
  .menu-side { background: rgba(255,255,255,.03); border-left: 1px solid var(--line); padding: 26px 24px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 22px; }
  .era-col { border-radius: 14px; padding: 14px 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .era-col .en { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .era-col .et { font-weight: 800; font-size: 15px; }
  .era-col .ei { font-size: 26px; }
  .node { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid transparent; }
  .node:hover, .node.sel { background: rgba(255,183,3,.08); border-color: rgba(255,183,3,.4); }
  .node.locked { opacity: .4; cursor: not-allowed; }
  .node .num { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: rgba(255,255,255,.08); }
  .node.done .num { background: var(--accent); color: #1b2430; }
  .node .tt { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .node .ss { font-size: 11px; }
  .menu-side h2 { font-size: 22px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 4px; }
  .thumbs span { display: inline-flex; flex-direction: column; align-items: center; width: 74px; font-size: 11px; text-align: center; color: var(--muted); }
  .thumbs img { width: 48px; height: 48px; }
  .menu-side .thumbs { display: flex; flex-wrap: wrap; gap: 4px; }
  .menu-side .thumbs span { display: inline-flex; flex-direction: column; align-items: center; width: 62px; font-size: 10.5px; text-align: center; color: var(--muted); }
  .menu-side .thumbs img { width: 44px; height: 44px; }
  .menu-side .grow { flex: 1; }

  /* Rezeptbuch */
  .card.book { max-width: 1100px; padding: 0; display: grid; grid-template-columns: 290px 1fr; height: min(780px, calc(100vh - 40px)); overflow: hidden; }
  .book-list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .book-list .bh { padding: 18px 16px 10px; }
  .book-list input { width: 100%; margin-top: 10px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 7px 10px; font: inherit; font-size: 13px; outline: none; }
  .book-items { overflow-y: auto; padding: 0 8px 14px; }
  .book-items h4 { margin: 12px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .bi { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; font-size: 13px; }
  .bi:hover { background: rgba(255,255,255,.06); }
  .bi.sel { background: rgba(255,183,3,.14); color: var(--accent); }
  .bi img { width: 28px; height: 28px; }
  .book-detail { padding: 22px 26px; overflow-y: auto; }
  .bd-head { display: flex; gap: 16px; align-items: center; }
  .bd-head img { width: 96px; height: 96px; background: rgba(255,255,255,.04); border-radius: 16px; }
  .recipe-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; }
  .recipe-row .arrow { color: var(--muted); font-size: 18px; }
  .ing { all: unset; cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; width: 76px; font-size: 11.5px; text-align: center; gap: 2px; padding: 4px; border-radius: 8px; }
  .ing:hover { background: rgba(255,255,255,.07); }
  .ing img { width: 44px; height: 44px; }
  .ing .q { color: var(--accent); font-weight: 700; }
  .mach { display: inline-flex; flex-direction: column; align-items: center; width: 92px; font-size: 11.5px; text-align: center; color: var(--accent-2); }
  .mach img { width: 50px; height: 50px; }
  .usedin { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Hilfe */
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin-top: 14px; font-size: 14px; align-items: center; }
  .keys kbd { font-size: 12px; padding: 2px 7px; color: var(--text); justify-self: start; }

  @media (max-width: 860px) {
    #info { display: none; }
    #buildbar { left: 88px; }
    #right { width: 200px; }
    #showcase { height: 160px; }
    .tool kbd { display: none; }
    #tutorial { top: 12px; max-width: 46vw; }
  }
</style>
</head>
<body>
<div id="nav" class="panel">
  <div class="logo-s">ABSURD<br>IND.</div>
  <button class="navbtn" id="btn-menu" title="Menü (Esc)"><span class="ic">☰</span><span class="lb">Menü</span></button>
  <button class="navbtn" id="btn-book" title="Rezeptbuch (B)"><span class="ic">📖</span><span class="lb">Rezepte</span></button>
  <button class="navbtn" id="btn-shop" title="Werkstatt (U)"><span class="ic">🔧</span><span class="lb">Werkstatt</span></button>
  <button class="navbtn" id="btn-stats" title="Produktion (P)"><span class="ic">📊</span><span class="lb">Produktion</span></button>
  <button class="navbtn" id="btn-help" title="Steuerung (H)"><span class="ic">?</span><span class="lb">Hilfe</span></button>
  <button class="navbtn" id="btn-mute" title="Ton an/aus"><span class="ic">🔊</span><span class="lb">Ton</span></button>
</div>
<div id="topbar" class="panel">
  <span class="title" id="chapter-title"></span>
  <span class="time" id="time">0:00</span>
  <span class="power" id="power" title="Strom: Angebot / Bedarf"></span>
  <span class="stock" title="Baukonto: Eisen aus dem Materiallager">⛓ <b id="stock">0</b> Eisen</span>
  <button class="btn speed" data-speed="0" title="Pause (Leertaste)">❚❚</button>
  <button class="btn speed active" data-speed="1">1×</button>
  <button class="btn speed" data-speed="2">2×</button>
  <button class="btn speed" data-speed="4">4×</button>
</div>
<div id="right">
  <div id="goal" class="panel">
    <h2 id="goal-title"></h2>
    <ul id="parts"></ul>
    <div id="bar"><i></i></div>
    <div class="meta"><span id="star-target"></span><span id="surplus"></span></div>
  </div>
  <div id="showcase" class="panel" title="Klicken zum Vergrößern"><span>Schaufenster</span></div>
</div>
<div id="info" class="panel"></div>
<div id="tutorial" class="panel"></div>
<div id="buildbar" class="panel">
  <div class="bb-head"><div id="cats" style="display:flex;gap:4px"></div><input id="search" placeholder="Gebäude suchen …  /" autocomplete="off"></div>
  <div id="tiles"></div>
</div>
<div id="toast" class="panel"></div>
<div id="overlay"><div class="card" id="card"></div></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
